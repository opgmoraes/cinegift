<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sua Sessão Especial | CineGift</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sessao.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="cinema-body" data-tema="romance">
    <div id="loader" class="loader-overlay">
      <div class="popcorn-loader">🍿</div>
      <p>Preparando sua sessão...</p>
    </div>

    <main id="jornada-container">
      <section id="fase-ticket" class="fase active">
        <div class="ticket-wrapper">
          <div class="ticket-card">
            <div class="ticket-header">CineGift VIP</div>
            <div class="ticket-content">
              <p>Admit One</p>
              <h2 id="ticket-estrela">Convidado</h2>
              <div class="barcode">||||||||||||||||||||</div>
            </div>
          </div>
          <button class="btn-acao" onclick="proximaFase('fase-poltrona')">
            🎟️ Escanear Ingresso
          </button>
        </div>
      </section>

      <section id="fase-poltrona" class="fase">
        <div class="interativo-box">
          <h2>Escolha seu lugar</h2>
          <div class="seat-grid">
            <div class="seat"></div>
            <div class="seat"></div>
            <div class="seat"></div>
            <div class="seat selected"></div>
            <div class="seat"></div>
            <div class="seat"></div>
          </div>
          <h3>O que vai acompanhar?</h3>
          <div class="snacks">
            <span>🍿 Pipoca</span> <span>🥤 Soda</span>
            <span>🍫 Chocolate</span>
          </div>
          <button class="btn-acao" onclick="proximaFase('fase-corredor')">
            Ir para a Sala 🎬
          </button>
        </div>
      </section>

      <section id="fase-corredor" class="fase">
        <div class="lobby-content">
          <div class="frase-dinamica" id="frase-corredor">
            "A nossa melhor história começa agora..."
          </div>
          <div class="lobby-gallery" id="lobbyGallery"></div>
          <button class="btn-acao" id="btn-entrar-sala">
            Entrar na Sala 🚪
          </button>
        </div>
      </section>

      <section id="fase-filme" class="fase">
        <div class="curtain-container">
          <div class="curtain-valance"></div>
          <div class="curtain left" id="curtainLeft"></div>
          <div class="curtain right" id="curtainRight"></div>

          <div class="theater-screen">
            <div class="video-wrapper">
              <video id="moviePlayer" playsinline preload="auto"></video>
              <div id="playButton" class="play-overlay">
                <button>▶ Iniciar Sessão</button>
              </div>
            </div>

            <div id="credits" class="credits-roll">
              <div class="credits-content">
                <h1 id="msgEstrela">Nome</h1>
                <p id="msgFinal">Mensagem...</p>
                <span class="credits-label">Dirigido por</span>
                <h3 id="msgDiretor">Você</h3>
                <div class="the-end">FIM</div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="js/sessao.js"></script>
  </body>
</html>
